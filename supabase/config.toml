project_id = "catatanhd"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

# Server email lokal. Email tidak benar-benar dikirim, tetapi bisa dibaca
# lewat antarmuka web pada port 54324.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/konfirmasi"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

# Konfirmasi email dimatikan hanya untuk pengembangan lokal agar tidak perlu
# membuka kotak masuk. Di produksi, aktifkan lewat dashboard Supabase.
[auth.email]
enabled = true
double_confirm_changes = false
enable_confirmations = false
